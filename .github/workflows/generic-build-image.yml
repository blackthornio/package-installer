name: Build Docker Image

on:
  workflow_call:
    inputs:
      REPOSITORY:
        required: true
        type: string
      VERSION:
        required: true
        type: string
      SERVICE_ROLE:
        required: true
        type: string
    outputs:
      image:
        description: "The image that was built and pushed to ECR"
        value: ${{ jobs.start.outputs.image }}
jobs:
  start:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.SERVICE_ROLE }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
        with:
          mask-password: 'true'

      - name: Build, tag, and push docker image to Amazon ECR
        id: build-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ inputs.REPOSITORY }}
          VERSION: ${{ inputs.VERSION }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$VERSION -t $REGISTRY/$REPOSITORY:latest -f Dockerfile.prod .
          docker push -a $REGISTRY/$REPOSITORY
          echo "image=$REGISTRY/$REPOSITORY:$VERSION" >> $GITHUB_OUTPUT

name: Deploy Image

on:
  workflow_call:
    inputs:
      SERVICE_ROLE:
        required: true
        type: string
      IMAGE:
        required: true
        type: string
      PACKAGE:
        required: true
        type: string
      TASK_DEFINITION_NAME:
        required: true
        type: string
      ESC_CLUSTER_NAME:
        required: true
        type: string
      ESC_SERVICE_NAME:
        required: true
        type: string

jobs:
  start:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.SERVICE_ROLE }}
          aws-region: us-east-1

      - name: Get task definition
        env:
          TASK_DEFINITION_NAME: ${{ inputs.TASK_DEFINITION_NAME }}
        run: |
          aws ecs describe-task-definition --task-definition $TASK_DEFINITION_NAME --query taskDefinition \
            | jq 'del(.compatibilities, .taskDefinitionArn, .requiresAttributes, .revision, .status, .registeredAt, .registeredBy)' \
            > task-definition.json

      - name: Update task definition
        id: task
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v.1.9.1
        with:
          task-definition: task-definition.json
          container-name: ${{ inputs.PACKAGE }}
          image: ${{ inputs.IMAGE }}

      - name: Deploy task definition and update service
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2
        with:
          task-definition: ${{ steps.task.outputs.task-definition }}
          cluster: ${{ inputs.ESC_CLUSTER_NAME }}
          service: ${{ inputs.ESC_SERVICE_NAME }}
